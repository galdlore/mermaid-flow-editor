name: Release Windows Installer and Extension

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.ver.outputs.should_release }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check package.json version against remote tags
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version in package.json: $VERSION"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin. Skipping release build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected (${TAG}). Starting Windows release build."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Build Chrome extension package
        shell: pwsh
        run: |
          npm run build:extension
          $ver = "${{ needs.check-version.outputs.version }}"
          $zipPath = "release/mermaid-flow-editor-extension-v$ver.zip"
          Compress-Archive -Path "dist-extension\*" -DestinationPath $zipPath -Force

      - name: Create GitHub tag and Release with Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.check-version.outputs.tag }}"
          $ver = "${{ needs.check-version.outputs.version }}"
          $zipPath = (Resolve-Path "release/mermaid-flow-editor-extension-v$ver.zip").Path
          $exeFiles = @(Get-ChildItem -Path "release" -Filter "*.exe" | ForEach-Object { $_.FullName })
          if ($exeFiles.Count -eq 0) {
            throw "Windows installer (.exe) was not found in release/"
          }
          $assets = $exeFiles + @($zipPath)
          gh release create $tag $assets --target "${{ github.sha }}" --title "$tag" --generate-notes
